[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pystores"
version = "0.1.0"
description = "Framework-agnostic, server-side UI state management for Python (NiceGUI backend included)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["state-management", "server-side-ui", "nicegui", "reactive", "stores"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]
dependencies = []

[project.optional-dependencies]
nicegui = ["nicegui>=2.0"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[project.urls]
Homepage = "https://github.com/zhangdi/pystores"
Repository = "https://github.com/zhangdi/pystores"

[tool.hatch.build.targets.wheel]
packages = ["src/pystores"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
